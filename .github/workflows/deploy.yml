name: Deploy (EC2)

on:
  push:
    branches: [ "main", "carkeeper_webapp_next.js" ]

permissions:
  contents: read

concurrency:
  group: deploy-carkeeper-ec2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Deploy on self-hosted runner
        env:
          APP_DIR: ${{ vars.EC2_APP_DIR }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          APP_DIR="${APP_DIR:-$HOME/app}"
          cd "$APP_DIR"
          chmod +x scripts/deploy-ec2.sh
          APP_DIR="$APP_DIR" DEPLOY_BRANCH="$DEPLOY_BRANCH" bash scripts/deploy-ec2.sh
