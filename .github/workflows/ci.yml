name: CI

on:
  push:
    branches: [ "main", "carkeeper_webapp_next.js" ]
  pull_request:
    branches: [ "main", "carkeeper_webapp_next.js" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
