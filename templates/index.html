<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarKeeper</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #222;
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 14px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: rgb(17, 97, 201);
            font-size: 42px;
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 24px;
            margin-top: 30px;
            margin-bottom: 10px;
            color: #333;
            border-bottom: 2px solid #e6ecf3;
            padding-bottom: 6px;
        }

        p {
            margin-bottom: 10px;
            color: #555;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 12px 14px;
            margin: 10px 0;
            box-sizing: border-box;
            border: 1px solid #cfd8e3;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: rgb(17, 97, 201);
            box-shadow: 0 0 0 3px rgba(17, 97, 201, 0.15);
        }

        button {
            background-color: rgb(17, 97, 201);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        button:hover {
            background-color: rgb(13, 77, 161);
        }

        button:active {
            transform: scale(0.98);
        }

        hr {
            border: none;
            border-top: 1px solid #d8e0ea;
            margin: 30px 0;
        }

        #car_result {
            margin-top: 20px;
            padding: 18px;
            background-color: #f8fbff;
            border: 1px solid #d7e7ff;
            border-radius: 10px;
        }

        #car_result h3 {
            margin-top: 0;
            color: rgb(17, 97, 201);
        }

        #car_result ul {
            padding-left: 20px;
            margin-bottom: 0;
        }

        #car_result li {
            margin-bottom: 8px;
        }

        #car_result img {
            max-width: 100%;
            height: auto;
            display: block;
            margin-top: 14px;
            border-radius: 10px;
            border: 1px solid #d8e0ea;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="{{ url_for('static', filename='app_scripts.js') }}" defer></script>
</head>
<body>
    <div class="container">
        <h1>Welcome to CarKeeper!</h1>
        <p>Please enter the desired Car ID</p>

        <!-- Input field for user to enter car ID -->
        <input id="entered_car_id" type="text"/> 

        <!-- Button used to submit entered car ID -->
        <button id="enter_btn" type="button">Enter</button>

        <hr>

        <!-- Section to add new car -->
        <!-- 'placeholder' field refers to "hint" in input box before typing -->
        <h2>Add New Car</h2>   
        <input id="make" type="text" placeholder="Make" />
        <input id="model" type="text" placeholder="Model" />
        <input id="year" type="number" placeholder="Year" />
        <input id="mileage" type="number" placeholder="Current Mileage" />

        <!-- Currently requires user to enter own url for each car -->
        <input id="image_url" type="text" placeholder="Image URL (optional)" />

        <button id="add_car_btn" type="button">Add Car</button>

        <hr>

        <!-- Section to add service -->
        <h2>Add Service</h2>
        <input id="service_car_id" type="number" placeholder="Car ID" />
        <input id="service_date" type="text" placeholder="Service Date (MM/DD/YY)" />
        <input id="service_mileage" type="number" placeholder="Mileage at Service" />
        <input id="service_type" type="text" placeholder="Service Type" />
        <input id="service_description" type="text" placeholder="Description (optional)" />
        <input id="service_notes" type="text" placeholder="Notes (optional)" />
        <input id="service_cost" type="number" step="0.01" placeholder="Cost (optional)" />

        <button id="add_service_btn" type="button">Add Service</button>
        <!-- Container to display car search result -->
        <div id="car_result"></div>
    </div>
</body>
</html>
